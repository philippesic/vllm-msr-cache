[[exception]]
rule = "directive"
path = "tools/check.py"
match = "# noqa: I001"
reason = "The documented script entry must put the repository root on sys.path before importing its tools."

[[exception]]
rule = "script"
path = "tools/check.py"
match = "entry"
reason = "Established single local and CI validator; also supports module invocation."

[[exception]]
rule = "script"
path = ".githooks/pre-commit"
match = "entry"
reason = "Optional existing hook delegates directly to the validator."

[[exception]]
rule = "development-root"
path = "tools"
match = "deptry"
reason = "Validator tools legitimately import development dependencies; deptry scans serving and benchmark packages."

[[exception]]
rule = "development-root"
path = "tests"
match = "deptry"
reason = "Tests legitimately import pytest; dependency enforcement applies to serving and benchmark packages."

[[exception]]
rule = "adapter-import"
path = "pyproject.toml"
match = "semantic_offload.vllm_adapter -> vllm"
reason = "Only the reserved adapter boundary may import pinned vLLM; enforced by AST and import-linter."

[[exception]]
rule = "adapter-import"
path = "pyproject.toml"
match = "semantic_offload.vllm_adapter -> vllm.**"
