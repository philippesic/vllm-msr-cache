<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans)}figure{margin:0}figcaption{font-size:15px;font-weight:600;margin:0 0 12px}svg{display:block;width:100%;height:260px;overflow:visible}text{fill:var(--foreground);font-family:var(--font-sans);font-size:12px}.muted{fill:var(--muted-foreground)}.grid{stroke:var(--border)}.zero{stroke:var(--muted-foreground);stroke-dasharray:4 4}.base{stroke:var(--chart-2);fill:var(--chart-2)}.trial{stroke:var(--chart-1);fill:var(--chart-1)}p{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin:10px 0 0} @media(max-width:480px){svg{height:230px}text{font-size:13px}}
</style></head><body><figure aria-label="Throughput changes and conditional 95 percent intervals from fixed three-repeat development comparisons">
<figcaption>Fixed-repeat throughput results</figcaption>
<svg viewBox="0 0 700 260" role="img"><title>Existing wait hints improve throughput over ARC; additional candidates remain inconclusive</title>
<line class="grid" x1="220" y1="25" x2="220" y2="210"/><line class="grid" x1="340" y1="25" x2="340" y2="210"/><line class="zero" x1="400" y1="25" x2="400" y2="210"/><line class="grid" x1="460" y1="25" x2="460" y2="210"/><line class="grid" x1="580" y1="25" x2="580" y2="210"/>
<text x="0" y="48">Existing wait hints</text><text class="muted" x="0" y="65">versus plain ARC</text>
<line class="base" stroke-width="3" x1="549.7" x2="619.6" y1="49" y2="49"/><circle class="base" cx="584.5" cy="49" r="5"/><text x="695" y="53" text-anchor="end">+6.15%</text>
<text x="0" y="98">75% pressure gate</text><text class="muted" x="0" y="115">versus existing wait hints</text>
<line class="trial" stroke-width="3" x1="335.6" x2="465.0" y1="99" y2="99"/><circle class="trial" cx="399.6" cy="99" r="5"/><text x="695" y="103" text-anchor="end">−0.01%</text>
<text x="0" y="148">Tool-only publication</text><text class="muted" x="0" y="165">versus existing wait hints</text>
<line class="trial" stroke-width="3" x1="283.9" x2="596.4" y1="149" y2="149"/><circle class="trial" cx="436.2" cy="149" r="5"/><text x="695" y="153" text-anchor="end">+1.21%</text>
<text x="0" y="198">Timing + eviction combination</text><text class="muted" x="0" y="215">versus existing wait hints</text>
<line class="trial" stroke-width="3" x1="290.9" x2="609.6" y1="199" y2="199"/><circle class="trial" cx="446.1" cy="199" r="5"/><text x="695" y="203" text-anchor="end">+1.54%</text>
<text class="muted" x="220" y="239" text-anchor="middle">−6%</text><text class="muted" x="340" y="239" text-anchor="middle">−2%</text><text class="muted" x="400" y="239" text-anchor="middle">0</text><text class="muted" x="460" y="239" text-anchor="middle">+2%</text><text class="muted" x="580" y="239" text-anchor="middle">+6%</text>
</svg><p>Dots show throughput change; lines show conditional 95% intervals from three fixed repetitions. Selecting screens are excluded. Existing wait/gate and timing candidates used separate repeated panels on reused development inputs.</p><p>No additional candidate met the declared ≥2% improvement with an interval excluding zero. These are local development results, not fresh population confirmation.</p></figure></body></html>
